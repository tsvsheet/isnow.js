# Managed by nicerobot/tools.repository (distribute-build)
name: typescript
on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "biome.json*"
      - ".standards.yaml"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "biome.json*"
      - ".standards.yaml"
      - ".github/workflows/typescript.yml"
  schedule:
    - cron: "55 22 * * 5"
  workflow_dispatch:
concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/typescript@v2
